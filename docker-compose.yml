version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hanout-postgres
    environment:
      POSTGRES_DB: hanout
      POSTGRES_USER: hanout_user
      POSTGRES_PASSWORD: hanout_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanout_user -d hanout"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
