spring:
  application:
    name: hanout
  datasource:
    url: jdbc:h2:mem:hanoutdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

hanout:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  fiscal-stamp-millimes: 1000 # 1.000 TND
  vat:
    standard-rate: 19.0
    reduced-rate-1: 13.0
    reduced-rate-2: 7.0
  payout:
    return-window-days: 7
    platform-commission-rate: 10.0 # 10%
  risk:
    first-order-score: 20
    high-value-threshold-millimes: 300000 # 300 TND
    high-value-score: 30
    repeat-refusal-score: 50
    high-frequency-score: 35
    allow-cutoff: 25
    require-otp-cutoff: 55
    require-deposit-cutoff: 80
